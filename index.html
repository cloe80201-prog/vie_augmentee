<!doctype HTML>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Joyeux anniversaire Maxime !</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        #hint {
            position: fixed; bottom: 8%; left: 0; width: 100%; text-align: center;
            color: #fff; font-family: sans-serif; font-size: 18px; z-index: 10;
            pointer-events: none; text-shadow: 0 1px 4px #000;
        }
        #credit {
            position: fixed; bottom: 1%; left: 0; width: 100%; text-align: center;
            color: #fff; opacity: .6; font-family: sans-serif; font-size: 10px; z-index: 10;
            pointer-events: none; text-shadow: 0 1px 2px #000;
        }
    </style>
</head>
<body style='margin: 0px; overflow: hidden;'>

    <div id="hint">Vise le dessin du cadeau avec la caméra</div>
    <div id="credit">Modèle 3D « A Gift Box » par Rofnay (sketchfab.com/Rofnay) — CC-BY 4.0</div>

    <a-scene mindar-image="imageTargetSrc: image/cadeau.mind; uiLoading: no; uiScanning: no;"
             color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-light type="ambient" intensity="0.9"></a-light>
        <a-light type="directional" intensity="0.8" position="1 3 2"></a-light>

        <!-- Le cursor + raycaster permettent de détecter un appui sur le cadeau -->
        <a-camera position="0 0 0" look-controls="enabled: false"
                  cursor="fuse: false; rayOrigin: mouse"
                  raycaster="objects: .clickable"></a-camera>

        <a-entity id="marker" mindar-image-target="targetIndex: 0">
            <a-entity rotation="90 0 0">

                <!-- Le cadeau en 3D : class="clickable" le rend cliquable -->
               <a-gltf-model id="gift" class="clickable" src="image/scene.gltf" scale="0.003 0.003 0.003"
                      animation="property: rotation; from: 0 -8 0; to: 0 8 0; dir: alternate; loop: true; dur: 1400; easing: easeInOutSine">
                </a-gltf-model>

                <!-- Le montant : caché au départ, apparaît quand on appuie sur le cadeau -->
                <a-entity id="reveal" position="0 0.8 0" scale="0 0 0" look-at="[camera]">
                    <a-plane width="1.5" height="0.8" color="#e63946" opacity="0.92"></a-plane>
                    <a-text value="30 euros" align="center" color="#ffffff"
                            width="5" position="0 0.12 0.01"></a-text>
                    <a-text value="Carte cadeau Cdiscount&#10;Joyeux 30 ans Maxime !" align="center" color="#ffd166"
                            width="2.3" position="0 -0.2 0.01"></a-text>
                </a-entity>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        const THREE = AFRAME.THREE;

        const clean = s => (s || '').replace(/[.\s]/g, '');

        const LID = ['Cube001', 'Torus', 'Cube006', 'Cube007', 'Cube008', 'Cube009',
                     'Cube010', 'Cube011', 'Cube012', 'Cube013', 'Cylinder'];
        const RIBBON = ['Cube002', 'Cube003', 'Cube004', 'Cube005'];

        const gift = document.querySelector('#gift');
        const marker = document.querySelector('#marker');
        const reveal = document.querySelector('#reveal');
        const hint = document.querySelector('#hint');

        let lidGroup, ribbonGroup;
        let ready = false, opened = false;

        gift.addEventListener('model-loaded', () => {
            const root = gift.getObject3D('mesh');
            root.updateMatrixWorld(true);

            lidGroup = new THREE.Group();
            ribbonGroup = new THREE.Group();
            root.add(lidGroup, ribbonGroup);

            const lidObjs = [], ribObjs = [];
            root.traverse(o => {
                const n = clean(o.name);
                if (LID.includes(n)) lidObjs.push(o);
                else if (RIBBON.includes(n)) ribObjs.push(o);
            });
            lidObjs.forEach(o => lidGroup.attach(o));
            ribObjs.forEach(o => ribbonGroup.attach(o));

            ready = true;
        });

        marker.addEventListener('targetFound', () => {
            if (!opened) hint.textContent = 'Appuie sur le cadeau pour l\'ouvrir';
        });
        marker.addEventListener('targetLost', () => {
            if (!opened) hint.textContent = 'Vise le dessin du cadeau avec la caméra';
        });

        // Appui directement sur le cadeau 3D
        gift.addEventListener('click', openGift);

        function openGift() {
            if (!ready || opened) return;
            opened = true;

            gift.removeAttribute('animation');
            gift.setAttribute('rotation', '0 0 0');
            hint.style.display = 'none';

            const t0 = performance.now();
            const DURATION = 1100;
            const PIVOT = -6.2;
            const SHRINK = 0.9;
            const ease = t => 1 - Math.pow(1 - t, 3);

            function step(now) {
                const t = Math.min((now - t0) / DURATION, 1);
                const e = ease(t);

                lidGroup.position.set(220 * e, 300 * e, 0);
                lidGroup.rotation.z = -0.9 * e;

                const k = 1 + (SHRINK - 1) * e;
                ribbonGroup.scale.y = k;
                ribbonGroup.position.y = PIVOT * (1 - k);

                if (t < 1) requestAnimationFrame(step);
                else lidGroup.visible = false;
            }
            requestAnimationFrame(step);

            reveal.setAttribute('animation__pop',
                'property: scale; from: 0 0 0; to: 1 1 1; dur: 700; delay: 700; easing: easeOutBack');
            reveal.setAttribute('animation__rise',
                'property: position; from: 0 0.6 0; to: 0 1.1 0; dur: 700; delay: 700; easing: easeOutQuad');
        }
    </script>
</body>
</html>
